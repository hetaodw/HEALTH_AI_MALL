# Anaconda环境配置脚本
创建并配置AI服务的conda环境

name: ai-service
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip
  - pip:
    - transformers>=4.35.0
    - peft>=0.6.0
    - accelerate>=0.24.0
    - datasets>=2.14.0
    - bitsandbytes>=0.41.0
    - huggingface-hub>=0.19.0
    - Pillow>=10.0.0
    - numpy>=1.24.0
    - pandas>=2.0.0
    - scikit-learn>=1.3.0
    - pyyaml>=6.0.0
    - tqdm>=4.66.0
    - requests>=2.31.0
    - matplotlib>=3.8.0
    - tensorboard>=2.14.0
    - wandb>=0.15.0
    - openai>=1.3.0
    - tiktoken>=0.5.0
    - sentencepiece>=0.1.99
    - pymysql>=1.1.0
