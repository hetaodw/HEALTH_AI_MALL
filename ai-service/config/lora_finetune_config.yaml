model:
  name: "Qwen3.5-2B"
  local_path: "D:\\26bs\\ai-service\\models\\Qwen3___5-2B"
  
  max_length: 2048
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  
  device: "auto"
  torch_dtype: "float16"

training:
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    bias: "none"
    task_type: "CAUSAL_LM"
  
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_steps: 100
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  
  optimizer: "adamw_torch"
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  fp16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  
  output_dir: "D:\\26bs\\ai-service\\models\\Qwen3___5-2B-lora"
  logging_dir: "D:\\26bs\\ai-service\\logs\\lora_training"
  save_total_limit: 3

data:
  training_data_dir: "D:\\26bs\\ai-service\\data\\training"
  train_file: "training_data_qwen.jsonl"
  
  max_samples: null
  train_test_split: 0.1
  train_eval_split: 0.1
  
  truncation: true
  padding: "max_length"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "D:\\26bs\\ai-service\\logs\\lora_finetune.log"
  
  tensorboard:
    enabled: true
    log_dir: "D:\\26bs\\ai-service\\logs\\tensorboard"
