<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康商城 API 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .api-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .api-section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .response {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            overflow-x: auto;
        }

        .response pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .token-display {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .method {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }

        .get { background: #61affe; color: white; }
        .post { background: #49cc90; color: white; }
        .put { background: #fca130; color: white; }
        .delete { background: #f93e3e; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 健康商城 API 测试页面</h1>

        <div class="api-section">
            <h2>🔐 用户认证</h2>
            <div class="grid">
                <div>
                    <h3><span class="method post">POST</span> 用户注册</h3>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="reg-username" placeholder="输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="reg-password" placeholder="输入密码">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="reg-email" placeholder="输入邮箱">
                    </div>
                    <button onclick="register()">注册</button>
                    <div id="reg-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method post">POST</span> 用户登录</h3>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="login-username" placeholder="输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" placeholder="输入密码">
                    </div>
                    <button onclick="login()">登录</button>
                    <div id="login-response" class="response"></div>
                </div>
            </div>
            <div id="token-display" class="token-display" style="display: none;">
                <strong>当前 Token:</strong> <span id="current-token"></span>
            </div>
        </div>

        <div class="api-section">
            <h2>📦 商品管理</h2>
            <div class="grid">
                <div>
                    <h3><span class="method get">GET</span> 获取商品列表</h3>
                    <div class="form-group">
                        <label>页码</label>
                        <input type="number" id="page-num" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>每页数量</label>
                        <input type="number" id="page-size" value="10" min="1">
                    </div>
                    <button onclick="getProducts()">获取商品列表</button>
                    <div id="products-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">GET</span> 获取商品详情</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="product-id" placeholder="输入商品ID">
                    </div>
                    <button onclick="getProductDetail()">获取商品详情</button>
                    <div id="product-detail-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">GET</span> 获取热门商品</h3>
                    <button onclick="getHotProducts()">获取热门商品</button>
                    <div id="hot-products-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">GET</span> 按分类获取商品</h3>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="category">
                            <option value="保健品">保健品</option>
                            <option value="医疗器械">医疗器械</option>
                            <option value="营养补充">营养补充</option>
                            <option value="健康食品">健康食品</option>
                        </select>
                    </div>
                    <button onclick="getProductsByCategory()">按分类获取商品</button>
                    <div id="category-products-response" class="response"></div>
                </div>
            </div>
        </div>

        <div class="api-section">
            <h2>👤 用户信息</h2>
            <div class="grid">
                <div>
                    <h3><span class="method get">GET</span> 获取用户信息</h3>
                    <button onclick="getUserInfo()">获取用户信息</button>
                    <div id="user-info-response" class="response"></div>
                </div>
            </div>
        </div>

        <div class="api-section">
            <h2>🏪 商家功能 (需要商家权限)</h2>
            <div class="grid">
                <div>
                    <h3><span class="method post">POST</span> 添加商品</h3>
                    <div class="form-group">
                        <label>商品名称</label>
                        <input type="text" id="merchant-add-title" placeholder="输入商品名称">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="merchant-add-category">
                            <option value="保健品">保健品</option>
                            <option value="医疗器械">医疗器械</option>
                            <option value="营养补充">营养补充</option>
                            <option value="健康食品">健康食品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="merchant-add-description" rows="3" placeholder="输入商品描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label>封面URL</label>
                        <input type="text" id="merchant-add-cover" placeholder="输入封面图片URL">
                    </div>
                    <div class="form-group">
                        <label>特性</label>
                        <input type="text" id="merchant-add-features" placeholder="输入商品特性，用逗号分隔">
                    </div>
                    <div class="form-group">
                        <label>价格</label>
                        <input type="number" id="merchant-add-price" placeholder="输入价格">
                    </div>
                    <div class="form-group">
                        <label>库存</label>
                        <input type="number" id="merchant-add-stock" placeholder="输入库存">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="merchant-add-status">
                            <option value="ON_SALE">在售</option>
                            <option value="OFF_SALE">下架</option>
                            <option value="OUT_OF_STOCK">缺货</option>
                        </select>
                    </div>
                    <button onclick="merchantAddProduct()">添加商品</button>
                    <div id="merchant-add-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method put">PUT</span> 修改商品</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="merchant-update-id" placeholder="输入商品ID">
                    </div>
                    <div class="form-group">
                        <label>商品名称</label>
                        <input type="text" id="merchant-update-title" placeholder="输入商品名称">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="merchant-update-category">
                            <option value="保健品">保健品</option>
                            <option value="医疗器械">医疗器械</option>
                            <option value="营养补充">营养补充</option>
                            <option value="健康食品">健康食品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="merchant-update-description" rows="3" placeholder="输入商品描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label>封面URL</label>
                        <input type="text" id="merchant-update-cover" placeholder="输入封面图片URL">
                    </div>
                    <div class="form-group">
                        <label>特性</label>
                        <input type="text" id="merchant-update-features" placeholder="输入商品特性，用逗号分隔">
                    </div>
                    <div class="form-group">
                        <label>价格</label>
                        <input type="number" id="merchant-update-price" placeholder="输入价格">
                    </div>
                    <div class="form-group">
                        <label>库存</label>
                        <input type="number" id="merchant-update-stock" placeholder="输入库存">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="merchant-update-status">
                            <option value="ON_SALE">在售</option>
                            <option value="OFF_SALE">下架</option>
                            <option value="OUT_OF_STOCK">缺货</option>
                        </select>
                    </div>
                    <button onclick="merchantUpdateProduct()">修改商品</button>
                    <div id="merchant-update-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method delete">DELETE</span> 删除商品</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="merchant-delete-id" placeholder="输入商品ID">
                    </div>
                    <button onclick="merchantDeleteProduct()">删除商品</button>
                    <div id="merchant-delete-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">GET</span> 获取商家商品列表</h3>
                    <div class="form-group">
                        <label>页码</label>
                        <input type="number" id="merchant-page-num" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>每页数量</label>
                        <input type="number" id="merchant-page-size" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>状态筛选</label>
                        <select id="merchant-status-filter">
                            <option value="">全部</option>
                            <option value="ON_SALE">在售</option>
                            <option value="OFF_SALE">下架</option>
                            <option value="OUT_OF_STOCK">缺货</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>分类筛选</label>
                        <select id="merchant-category-filter">
                            <option value="">全部</option>
                            <option value="保健品">保健品</option>
                            <option value="医疗器械">医疗器械</option>
                            <option value="营养补充">营养补充</option>
                            <option value="健康食品">健康食品</option>
                        </select>
                    </div>
                    <button onclick="merchantGetProducts()">获取商品列表</button>
                    <div id="merchant-products-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">GET</span> 获取商品详情</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="merchant-detail-id" placeholder="输入商品ID">
                    </div>
                    <button onclick="merchantGetProductDetail()">获取商品详情</button>
                    <div id="merchant-detail-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">PATCH</span> 更新商品状态</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="merchant-status-id" placeholder="输入商品ID">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="merchant-status-value">
                            <option value="ON_SALE">在售</option>
                            <option value="OFF_SALE">下架</option>
                            <option value="OUT_OF_STOCK">缺货</option>
                        </select>
                    </div>
                    <button onclick="merchantUpdateStatus()">更新状态</button>
                    <div id="merchant-status-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method get">PATCH</span> 更新商品库存</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="merchant-stock-id" placeholder="输入商品ID">
                    </div>
                    <div class="form-group">
                        <label>库存数量</label>
                        <input type="number" id="merchant-stock-value" placeholder="输入库存数量">
                    </div>
                    <button onclick="merchantUpdateStock()">更新库存</button>
                    <div id="merchant-stock-response" class="response"></div>
                </div>
            </div>
        </div>

        <div class="api-section">
            <h2>⚙️ 管理员功能 (需要管理员权限)</h2>
            <div class="grid">
                <div>
                    <h3><span class="method post">POST</span> 添加商品</h3>
                    <div class="form-group">
                        <label>商品名称</label>
                        <input type="text" id="add-name" placeholder="输入商品名称">
                    </div>
                    <div class="form-group">
                        <label>价格</label>
                        <input type="number" id="add-price" placeholder="输入价格">
                    </div>
                    <div class="form-group">
                        <label>库存</label>
                        <input type="number" id="add-stock" placeholder="输入库存">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="add-category">
                            <option value="保健品">保健品</option>
                            <option value="医疗器械">医疗器械</option>
                            <option value="营养补充">营养补充</option>
                            <option value="健康食品">健康食品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="add-description" rows="3" placeholder="输入商品描述"></textarea>
                    </div>
                    <button onclick="addProduct()">添加商品</button>
                    <div id="add-product-response" class="response"></div>
                </div>
                <div>
                    <h3><span class="method post">POST</span> 设置热门商品</h3>
                    <div class="form-group">
                        <label>商品ID</label>
                        <input type="number" id="hot-product-id" placeholder="输入商品ID">
                    </div>
                    <div class="form-group">
                        <label>排序</label>
                        <input type="number" id="hot-sort" value="1" min="1">
                    </div>
                    <button onclick="setHotProduct()">设置为热门商品</button>
                    <div id="hot-product-response" class="response"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost/v1';
        let authToken = localStorage.getItem('authToken') || '';

        function updateTokenDisplay() {
            const tokenDisplay = document.getElementById('token-display');
            const currentToken = document.getElementById('current-token');
            if (authToken) {
                tokenDisplay.style.display = 'block';
                currentToken.textContent = authToken.substring(0, 50) + '...';
            } else {
                tokenDisplay.style.display = 'none';
            }
        }

        async function apiRequest(method, endpoint, data = null, requireAuth = false) {
            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (requireAuth && authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }

            const options = {
                method: method,
                headers: headers
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const result = await response.json();
                return { success: response.ok, data: result, status: response.status };
            } catch (error) {
                return { success: false, data: { message: error.message }, status: 0 };
            }
        }

        function displayResponse(elementId, result) {
            const element = document.getElementById(elementId);
            element.className = 'response ' + (result.success ? 'success' : 'error');
            element.innerHTML = `<pre>${JSON.stringify(result.data, null, 2)}</pre>`;
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const email = document.getElementById('reg-email').value;

            if (!username || !password || !email) {
                alert('请填写所有字段');
                return;
            }

            const result = await apiRequest('POST', '/auth/register', {
                username,
                password,
                email
            });
            displayResponse('reg-response', result);
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                alert('请填写所有字段');
                return;
            }

            const result = await apiRequest('POST', '/auth/login', {
                username,
                password
            });
            displayResponse('login-response', result);

            if (result.success && result.data.data && result.data.data.token) {
                authToken = result.data.data.token;
                localStorage.setItem('authToken', authToken);
                updateTokenDisplay();
            }
        }

        async function getProducts() {
            const page = document.getElementById('page-num').value;
            const size = document.getElementById('page-size').value;
            const result = await apiRequest('GET', `/products?page=${page}&size=${size}`);
            displayResponse('products-response', result);
        }

        async function getProductDetail() {
            const productId = document.getElementById('product-id').value;
            if (!productId) {
                alert('请输入商品ID');
                return;
            }
            const result = await apiRequest('GET', `/products/${productId}`);
            displayResponse('product-detail-response', result);
        }

        async function getHotProducts() {
            const result = await apiRequest('GET', '/products/hot');
            displayResponse('hot-products-response', result);
        }

        async function getProductsByCategory() {
            const category = document.getElementById('category').value;
            const result = await apiRequest('GET', `/products/category/${encodeURIComponent(category)}`);
            displayResponse('category-products-response', result);
        }

        async function getUserInfo() {
            const result = await apiRequest('GET', '/user/profile', null, true);
            displayResponse('user-info-response', result);
        }

        async function addProduct() {
            const name = document.getElementById('add-name').value;
            const price = document.getElementById('add-price').value;
            const stock = document.getElementById('add-stock').value;
            const category = document.getElementById('add-category').value;
            const description = document.getElementById('add-description').value;

            if (!name || !price || !stock) {
                alert('请填写必填字段');
                return;
            }

            const result = await apiRequest('POST', '/admin/products', {
                name,
                price: parseFloat(price),
                stock: parseInt(stock),
                category,
                description
            }, true);
            displayResponse('add-product-response', result);
        }

        async function setHotProduct() {
            const productId = document.getElementById('hot-product-id').value;
            const sort = document.getElementById('hot-sort').value;

            if (!productId) {
                alert('请输入商品ID');
                return;
            }

            const result = await apiRequest('POST', '/admin/products/hot', {
                productId: parseInt(productId),
                sort: parseInt(sort)
            }, true);
            displayResponse('hot-product-response', result);
        }

        async function merchantAddProduct() {
            const title = document.getElementById('merchant-add-title').value;
            const category = document.getElementById('merchant-add-category').value;
            const description = document.getElementById('merchant-add-description').value;
            const coverUrl = document.getElementById('merchant-add-cover').value;
            const features = document.getElementById('merchant-add-features').value;
            const price = document.getElementById('merchant-add-price').value;
            const stock = document.getElementById('merchant-add-stock').value;
            const status = document.getElementById('merchant-add-status').value;

            if (!title || !price || !stock) {
                alert('请填写必填字段');
                return;
            }

            const result = await apiRequest('POST', '/merchant/products', {
                title,
                category,
                description,
                coverUrl,
                features: features ? features.split(',').map(f => f.trim()) : [],
                price: parseFloat(price),
                stock: parseInt(stock),
                status: status
            }, true);
            displayResponse('merchant-add-response', result);
        }

        async function merchantUpdateProduct() {
            const id = document.getElementById('merchant-update-id').value;
            const title = document.getElementById('merchant-update-title').value;
            const category = document.getElementById('merchant-update-category').value;
            const description = document.getElementById('merchant-update-description').value;
            const coverUrl = document.getElementById('merchant-update-cover').value;
            const features = document.getElementById('merchant-update-features').value;
            const price = document.getElementById('merchant-update-price').value;
            const stock = document.getElementById('merchant-update-stock').value;
            const status = document.getElementById('merchant-update-status').value;

            if (!id) {
                alert('请输入商品ID');
                return;
            }

            const result = await apiRequest('PUT', `/merchant/products/${id}`, {
                title,
                category,
                description,
                coverUrl,
                features: features ? features.split(',').map(f => f.trim()) : [],
                price: price ? parseFloat(price) : null,
                stock: stock ? parseInt(stock) : null,
                status: status
            }, true);
            displayResponse('merchant-update-response', result);
        }

        async function merchantDeleteProduct() {
            const id = document.getElementById('merchant-delete-id').value;

            if (!id) {
                alert('请输入商品ID');
                return;
            }

            const result = await apiRequest('DELETE', `/merchant/products/${id}`, null, true);
            displayResponse('merchant-delete-response', result);
        }

        async function merchantGetProducts() {
            const page = document.getElementById('merchant-page-num').value;
            const size = document.getElementById('merchant-page-size').value;
            const status = document.getElementById('merchant-status-filter').value;
            const category = document.getElementById('merchant-category-filter').value;

            let url = `/merchant/products?page=${page}&size=${size}`;
            if (status) {
                url += `&status=${status}`;
            }
            if (category) {
                url += `&category=${encodeURIComponent(category)}`;
            }

            const result = await apiRequest('GET', url, null, true);
            displayResponse('merchant-products-response', result);
        }

        async function merchantGetProductDetail() {
            const id = document.getElementById('merchant-detail-id').value;

            if (!id) {
                alert('请输入商品ID');
                return;
            }

            const result = await apiRequest('GET', `/merchant/products/${id}`, null, true);
            displayResponse('merchant-detail-response', result);
        }

        async function merchantUpdateStatus() {
            const id = document.getElementById('merchant-status-id').value;
            const status = document.getElementById('merchant-status-value').value;

            if (!id) {
                alert('请输入商品ID');
                return;
            }

            const result = await apiRequest('PATCH', `/merchant/products/${id}/status?status=${status}`, null, true);
            displayResponse('merchant-status-response', result);
        }

        async function merchantUpdateStock() {
            const id = document.getElementById('merchant-stock-id').value;
            const stock = document.getElementById('merchant-stock-value').value;

            if (!id || !stock) {
                alert('请填写所有字段');
                return;
            }

            const result = await apiRequest('PATCH', `/merchant/products/${id}/stock?stock=${stock}`, null, true);
            displayResponse('merchant-stock-response', result);
        }

        updateTokenDisplay();
    </script>
</body>
</html>
